<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QR Control</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: white;

            padding: 30px;

            border-radius: 22px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 15px;

            margin-bottom: 12px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;
        }

        button {
            width: 100%;

            padding: 16px;

            margin-top: 10px;

            border: none;

            border-radius: 12px;

            background: #111;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: transform 0.1s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        /* =========================
           DESTINATION ACTUELLE
           ========================= */

        .destination {
            padding: 18px;

            margin: 15px 0;

            border-radius: 12px;

            background: #f1f1f1;

            text-align: center;

            font-size: 18px;
        }

        .destination strong {
            display: block;

            margin-top: 6px;

            font-size: 22px;
        }


        /* =========================
           BOUTONS DE DESTINATION
           ========================= */

        .choice {
            background: white;

            color: #111;

            border: 2px solid #ddd;
        }

        .choice.selected {
            border-color: #111;

            background: #eee;
        }


        /* =========================
           MESSAGE
           ========================= */

        #message {
            text-align: center;

            margin-top: 15px;

            color: #555;

            opacity: 1;

            transition: opacity 0.6s ease;
        }

        #message.hidden {
            opacity: 0;
        }


        /* =========================
           LOGOUT
           ========================= */

        .logout {
            background: #777;

            margin-top: 20px;
        }


        .hidden {
            display: none;
        }

    </style>

</head>


<body>

<div class="container">


    <!-- =====================================================
         LOGIN
         ===================================================== -->

    <div id="loginCard" class="card">

        <h1>QR Control</h1>

        <input
            id="email"
            type="email"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Mot de passe"
        >

        <button onclick="login()">

            Se connecter

        </button>

        <div id="loginMessage"></div>

    </div>



    <!-- =====================================================
         CONTROL PANEL
         ===================================================== -->

    <div id="controlCard" class="card hidden">

        <h1>QR Control</h1>


        <!-- DESTINATION RÉELLEMENT ENREGISTRÉE -->

        <div class="destination">

            Destination actuelle :

            <strong id="currentDestination">
                ...
            </strong>

        </div>



        <!-- CHOIX TEMPORAIRE -->

        <button
            class="choice"
            id="siteButton"
            onclick="selectDestination('site')">

            🌐 SITE

        </button>


        <button
            class="choice"
            id="imageButton"
            onclick="selectDestination('image')">

            🖼️ IMAGE

        </button>


        <button
            class="choice"
            id="lienButton"
            onclick="selectDestination('lien')">

            🔗 LIEN

        </button>



        <!-- APPLICATION DU CHOIX -->

        <button onclick="saveDestination()">

            APPLIQUER

        </button>



        <!-- MESSAGE DE CONFIRMATION -->

        <div
            id="message"
            class="hidden">
        </div>



        <!-- DÉCONNEXION -->

        <button
            class="logout"
            onclick="logout()">

            Se déconnecter

        </button>

    </div>

</div>



<script>


    // =====================================================
    // SUPABASE
    // =====================================================

    const SUPABASE_URL =
        "https://frdmtstprhyrcozuzkcf.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_YkzwqM3E18r1W0ztmJjXug_qJO2htuo";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );



    // =====================================================
    // VARIABLES
    // =====================================================

    // Choix actuellement sélectionné par l'utilisateur.
    //
    // Ce n'est PAS forcément la destination active.

    let selectedDestination = null;


    // Destination réellement enregistrée dans Supabase.

    let currentDestination = null;


    // Timer du message de confirmation.

    let messageTimeout = null;



    // =====================================================
    // LOGIN
    // =====================================================

    async function login() {

        const email =
            document.getElementById("email").value;


        const password =
            document.getElementById("password").value;


        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            document
                .getElementById("loginMessage")
                .textContent =
                    "Erreur : " + error.message;

            return;

        }


        showControlPanel();

    }



    // =====================================================
    // AFFICHER LE PANNEAU
    // =====================================================

    async function showControlPanel() {

        document
            .getElementById("loginCard")
            .classList.add("hidden");


        document
            .getElementById("controlCard")
            .classList.remove("hidden");


        await loadDestination();

    }



    // =====================================================
    // LIRE LA DESTINATION RÉELLE
    // =====================================================

    async function loadDestination() {

        const { data, error } =

            await supabaseClient
                .from("qr-control")
                .select("destination")
                .eq("id", 1)
                .single();


        if (error) {

            document
                .getElementById("message")
                .textContent =
                    "Erreur : " + error.message;

            return;

        }


        // Destination réellement active.

        currentDestination =
            data.destination;


        // Le choix initial est le même que
        // la destination réellement active.

        selectedDestination =
            currentDestination;


        updateInterface();

    }



    // =====================================================
    // CHOISIR UNE DESTINATION
    // =====================================================

    function selectDestination(destination) {

        // On change uniquement le choix temporaire.

        selectedDestination =
            destination;


        updateInterface();

    }



    // =====================================================
    // METTRE À JOUR L'INTERFACE
    // =====================================================

    function updateInterface() {

        // IMPORTANT :
        //
        // "Destination actuelle" affiche toujours
        // ce qui est réellement enregistré dans Supabase.

        document
            .getElementById("currentDestination")
            .textContent =
                currentDestination;


        // Le bouton sélectionné correspond au choix
        // que l'utilisateur est en train de préparer.

        document
            .querySelectorAll(".choice")
            .forEach(button => {

                button.classList.remove("selected");

            });


        if (selectedDestination) {

            document
                .getElementById(
                    selectedDestination + "Button"
                )
                .classList.add("selected");

        }

    }



    // =====================================================
    // SAUVEGARDER / APPLIQUER
    // =====================================================

    async function saveDestination() {


        // -------------------------------------------------
        // 1. CACHER IMMÉDIATEMENT L'ANCIEN MESSAGE
        // -------------------------------------------------

        const message =
            document.getElementById("message");


        clearTimeout(messageTimeout);


        message.classList.add("hidden");


        // -------------------------------------------------
        // 2. SAUVEGARDER DANS SUPABASE
        // -------------------------------------------------

        const { error } =

            await supabaseClient
                .from("qr-control")
                .update({

                    destination:
                        selectedDestination

                })
                .eq("id", 1);


        // -------------------------------------------------
        // 3. GESTION D'UNE ERREUR
        // -------------------------------------------------

        if (error) {

            message.textContent =
                "Erreur : " + error.message;


            message.classList.remove("hidden");

            return;

        }


        // -------------------------------------------------
        // 4. METTRE À JOUR LA DESTINATION RÉELLE
        // -------------------------------------------------

        currentDestination =
            selectedDestination;


        // L'interface affiche maintenant la nouvelle
        // destination comme destination réellement active.

        updateInterface();


        // -------------------------------------------------
        // 5. AFFICHER LA CONFIRMATION
        // -------------------------------------------------

        message.textContent =
            "Destination enregistrée ✓";


        message.classList.remove("hidden");


        // -------------------------------------------------
        // 6. NOUVEAU COMPTEUR DE 5 SECONDES
        // -------------------------------------------------

        messageTimeout =
            setTimeout(() => {

                message.classList.add("hidden");

            }, 5000);

    }



    // =====================================================
    // LOGOUT
    // =====================================================

    async function logout() {

        await supabaseClient.auth.signOut();

        location.reload();

    }



    // =====================================================
    // VÉRIFIER LA SESSION
    // =====================================================

    async function checkSession() {

        const { data } =
            await supabaseClient.auth.getSession();


        if (data.session) {

            showControlPanel();

        }

    }


    checkSession();


</script>

</body>

</html>
