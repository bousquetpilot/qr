<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Romain Bousquet</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            color: #111;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 30px 20px;
        }

        .profile {
            text-align: center;
        }

        .profile img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        h1 {
            margin: 5px 0;
            font-size: 28px;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            background: white;
            color: #111;
            text-decoration: none;
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: 0.2s;
            cursor: pointer;
        }

        .button:hover {
            transform: scale(1.02);
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 13px;
        }

        #loading {
            text-align: center;
            color: #777;
        }

        #content {
            display: none;
        }

    </style>

</head>

<body>


<div class="container">

    <div id="loading">
        Chargement...
    </div>


    <div id="content">


        <div class="profile">

            <img
                id="profileImage"
                src="photo.jpg"
                alt="Photo"
            >

            <h1 id="name">
                Romain Bousquet
            </h1>

            <div
                id="title"
                class="description"
            >
                Pilot ✈️
            </div>

        </div>


        <a
            id="phoneButton"
            class="button"
        >
            📞 Téléphone
        </a>


        <a
            id="emailButton"
            class="button"
        >
            ✉️ Email
        </a>


        <a
            id="instagramButton"
            class="button"
            target="_blank"
            rel="noopener noreferrer"
        >
            📷 Instagram
        </a>


        <a
            id="cvButton"
            class="button"
            target="_blank"
            rel="noopener noreferrer"
        >
            📄 Mon CV
        </a>


        <div class="footer">
            QR Digital Card
        </div>

    </div>

</div>


<script>


const SUPABASE_URL =
    "https://frdmtstprhyrcozuzkcf.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_YkzwqM3E18r1W0ztmJjXug_qJO2htuo";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const BUCKET = "qr-images";



async function loadSite() {


    const {
        data,
        error
    } = await supabaseClient

        .from("site-content")

        .select("*")

        .eq("id", 1)

        .single();


    if (error) {

        console.error(error);

        document.getElementById(
            "loading"
        ).textContent =
            "Erreur de chargement.";

        return;
    }


    console.log("DONNÉES SUPABASE :", data);



    // NOM

    document.getElementById(
        "name"
    ).textContent =
        data.name || "Romain Bousquet";



    // TITRE

    document.getElementById(
        "title"
    ).textContent =
        data.title || "Pilot ✈️";



    // =================================================
    // TÉLÉPHONE
    // =================================================

    const phone =
        document.getElementById(
            "phoneButton"
        );


    if (data.phone) {

        phone.href =
            "tel:" +
            data.phone;

    }



    // =================================================
    // EMAIL
    // =================================================

    const email =
        document.getElementById(
            "emailButton"
        );


    if (data.email) {

        email.href =
            "mailto:" +
            data.email;

    } else {

        email.href = "#";

    }



    // =================================================
    // INSTAGRAM
    // =================================================

    const instagram =
        document.getElementById(
            "instagramButton"
        );


    if (data.instagram_url) {

        let instagramURL =
            data.instagram_url.trim();


        if (
            !instagramURL.startsWith("http://") &&
            !instagramURL.startsWith("https://")
        ) {

            instagramURL =
                "https://" +
                instagramURL;

        }


        instagram.href =
            instagramURL;

    } else {

        instagram.href = "#";

    }



    // =================================================
    // CV
    // =================================================

    const cv =
        document.getElementById(
            "cvButton"
        );


    if (data.cv_path) {

        const {
            data: publicURL
        } =
            supabaseClient

                .storage

                .from(BUCKET)

                .getPublicUrl(
                    data.cv_path
                );


        cv.href =
            publicURL.publicUrl;

    } else {

        cv.href = "#";

    }



    // =================================================
    // PHOTO
    // =================================================

    const image =
        document.getElementById(
            "profileImage"
        );


    if (data.profile_image_path) {

        const {
            data: publicURL
        } =
            supabaseClient

                .storage

                .from(BUCKET)

                .getPublicUrl(
                    data.profile_image_path
                );


        image.src =
            publicURL.publicUrl +
            "?v=" +
            Date.now();

    }



    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "content"
    ).style.display =
        "block";

}


loadSite();

</script>


</body>

</html>
