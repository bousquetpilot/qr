<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Site personnel</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f2f2f2;

            color: #111;
        }


        .container {
            width: 100%;

            max-width: 500px;

            margin: auto;

            padding: 30px 20px;
        }


        .profile {
            text-align: center;

            margin-bottom: 30px;
        }


        .profile img {
            width: 120px;

            height: 120px;

            object-fit: cover;

            border-radius: 50%;

            margin-bottom: 15px;
        }


        h1 {
            margin:
                5px 0;

            font-size:
                28px;
        }


        .title {
            color: #666;

            margin-bottom: 10px;
        }


        .description {
            color: #666;

            line-height: 1.5;

            margin:
                15px 0 30px;
        }


        .button {
            display: block;

            width: 100%;

            padding: 16px;

            margin:
                12px 0;

            background: white;

            color: #111;

            text-decoration: none;

            border-radius: 12px;

            text-align: center;

            font-size: 17px;

            box-shadow:
                0 3px 10px
                rgba(0,0,0,0.08);

            transition:
                0.2s;
        }


        .button:hover {
            transform:
                scale(1.02);
        }


        .footer {
            text-align: center;

            margin-top: 30px;

            color: #999;

            font-size: 13px;
        }


        #loading {
            text-align: center;

            color: #777;

            padding-top: 40px;
        }


        #content {
            display: none;
        }

    </style>

</head>


<body>


<div class="container">


    <div id="loading">
        Chargement...
    </div>



    <div id="content">


        <!-- =================================================
             PROFIL
             ================================================= -->

        <div class="profile">


            <img
                id="profileImage"
                alt="Photo"
            >


            <h1 id="name">
                Romain Bousquet
            </h1>


            <div
                id="title"
                class="title"
            >
            </div>


            <div
                id="description"
                class="description"
            >
            </div>


        </div>



        <!-- =================================================
             BOUTONS
             ================================================= -->

        <a
            id="phoneButton"
            class="button"
        >
            📞 Téléphone
        </a>


        <a
            id="emailButton"
            class="button"
        >
            ✉️ Email
        </a>


        <a
            id="addressButton"
            class="button"
            target="_blank"
            rel="noopener noreferrer"
        >
            📍 Adresse
        </a>


        <a
            id="instagramButton"
            class="button"
            target="_blank"
            rel="noopener noreferrer"
        >
            📷 Instagram
        </a>


        <a
            id="cvButton"
            class="button"
            target="_blank"
            rel="noopener noreferrer"
        >
            📄 Mon CV
        </a>



        <div class="footer">
            QR Digital Card
        </div>


    </div>


</div>



<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
    "https://frdmtstprhyrcozuzkcf.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_YkzwqM3E18r1W0ztmJjXug_qJO2htuo";


const BUCKET =
    "qr-images";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



// =====================================================
// CACHER UN ÉLÉMENT
// =====================================================

function hideElement(
    element
) {

    if (element) {

        element.style.display =
            "none";

    }

}



// =====================================================
// CHARGER LE SITE
// =====================================================

async function loadSite() {


    const {
        data,
        error
    } =
        await supabaseClient

            .from("site-content")

            .select("*")

            .eq("id", 1)

            .single();



    // =================================================
    // ERREUR
    // =================================================

    if (error) {

        console.error(
            "Erreur Supabase :",
            error
        );


        document.getElementById(
            "loading"
        ).textContent =
            "Erreur de chargement.";

        return;

    }



    // =================================================
    // NOM
    // =================================================

    document.getElementById(
        "name"
    ).textContent =
        data.name ||
        "Romain Bousquet";



    // =================================================
    // TITRE
    // =================================================

    const title =
        document.getElementById(
            "title"
        );


    if (
        data.show_title !== false &&
        data.title
    ) {

        title.textContent =
            data.title;

    } else {

        hideElement(
            title
        );

    }



    // =================================================
    // DESCRIPTION
    // =================================================

    const description =
        document.getElementById(
            "description"
        );


    if (
        data.show_description !== false &&
        data.description
    ) {

        description.textContent =
            data.description;

    } else {

        hideElement(
            description
        );

    }



    // =================================================
    // PHOTO
    // =================================================

    const image =
        document.getElementById(
            "profileImage"
        );


    if (
        data.show_profile_image !== false &&
        data.profile_image_path
    ) {


        const {
            data: publicData
        } =
            supabaseClient

                .storage

                .from(BUCKET)

                .getPublicUrl(
                    data.profile_image_path
                );


        image.src =
            publicData.publicUrl +
            "?v=" +
            Date.now();


    } else {


        hideElement(
            image
        );

    }



    // =================================================
    // TÉLÉPHONE
    // =================================================

    const phone =
        document.getElementById(
            "phoneButton"
        );


    if (
        data.show_phone !== false &&
        data.phone
    ) {


        phone.href =
            "tel:" +
            data.phone;


    } else {


        hideElement(
            phone
        );

    }



    // =================================================
    // EMAIL
    // =================================================

    const email =
        document.getElementById(
            "emailButton"
        );


    if (
        data.show_email !== false &&
        data.email
    ) {


        email.href =
            "mailto:" +
            data.email;


    } else {


        hideElement(
            email
        );

    }



    // =================================================
    // ADRESSE
    // =================================================

    const address =
        document.getElementById(
            "addressButton"
        );


    if (
        data.show_address !== false &&
        data.address
    ) {


        const addressText =
            data.address.trim();


        address.textContent =
            "📍 " +
            addressText;


        address.href =
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(
                addressText
            );


    } else {


        hideElement(
            address
        );

    }



    // =================================================
    // INSTAGRAM
    // =================================================

    const instagram =
        document.getElementById(
            "instagramButton"
        );


    if (
        data.show_instagram !== false &&
        data.instagram_url
    ) {


        let instagramURL =
            data.instagram_url.trim();


        if (
            !instagramURL.startsWith(
                "http://"
            ) &&
            !instagramURL.startsWith(
                "https://"
            )
        ) {

            instagramURL =
                "https://" +
                instagramURL;

        }


        instagram.href =
            instagramURL;


    } else {


        hideElement(
            instagram
        );

    }



    // =================================================
    // CV
    // =================================================

    const cv =
        document.getElementById(
            "cvButton"
        );


    if (
        data.show_cv !== false &&
        data.cv_path
    ) {


        const {
            data: publicData
        } =
            supabaseClient

                .storage

                .from(BUCKET)

                .getPublicUrl(
                    data.cv_path
                );


        cv.href =
            publicData.publicUrl;


    } else {


        hideElement(
            cv
        );

    }



    // =================================================
    // AFFICHER LE SITE
    // =================================================

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "content"
    ).style.display =
        "block";

}



// =====================================================
// LANCER
// =====================================================

loadSite();


</script>


</body>

</html>
