<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Romain Bousquet</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            color: #111;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 30px 20px;
        }

        .profile {
            text-align: center;
        }

        .profile img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        h1 {
            margin: 5px 0;
            font-size: 28px;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;

            background: white;
            color: #111;

            text-decoration: none;

            border-radius: 12px;

            text-align: center;

            font-size: 17px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.08);

            transition: 0.2s;
        }

        .button:hover {
            transform: scale(1.02);
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 13px;
        }

        #loading {
            text-align: center;
            color: #777;
        }

        #content {
            display: none;
        }

    </style>

</head>


<body>


<div class="container">


    <div id="loading">
        Chargement...
    </div>


    <div id="content">


        <!-- =========================
             PROFIL
             ========================= -->

        <div class="profile">

            <img
                id="profileImage"
                src="photo.jpg"
                alt="Photo"
            >

            <h1 id="name">
                Romain Bousquet
            </h1>

            <div
                id="title"
                class="description"
            >
                Pilot ✈️
            </div>

        </div>



        <!-- =========================
             TÉLÉPHONE
             ========================= -->

        <a
            id="phoneButton"
            class="button"
            href="#"
        >
            📞 Téléphone
        </a>



        <!-- =========================
             EMAIL
             ========================= -->

        <a
            id="emailButton"
            class="button"
            href="#"
        >
            ✉️ Email
        </a>



        <!-- =========================
             INSTAGRAM
             ========================= -->

        <a
            id="instagramButton"
            class="button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            📷 Instagram
        </a>



        <!-- =========================
             CV
             ========================= -->

        <a
            id="cvButton"
            class="button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            📄 Mon CV
        </a>



        <div class="footer">
            QR Digital Card
        </div>


    </div>


</div>



<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
    "https://frdmtstprhyrcozuzkcf.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_YkzwqM3E18r1W0ztmJjXug_qJO2htuo";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const BUCKET =
    "qr-images";



// =====================================================
// CHARGEMENT
// =====================================================

async function loadSite() {


    const {
        data,
        error
    } = await supabaseClient

        .from("site-content")

        .select(`
            name,
            title,
            phone,
            email,
            instagram_url,
            cv_path,
            profile_image_path
        `)

        .eq("id", 1)

        .single();



    // =================================================
    // ERREUR
    // =================================================

    if (error) {

        console.error(
            "Erreur Supabase :",
            error
        );

        document.getElementById(
            "loading"
        ).textContent =
            "Impossible de charger la page.";

        return;
    }



    // =================================================
    // NOM
    // =================================================

    document.getElementById(
        "name"
    ).textContent =
        data.name ||
        "Romain Bousquet";



    // =================================================
    // TITRE
    // =================================================

    document.getElementById(
        "title"
    ).textContent =
        data.title ||
        "";



    // =================================================
    // TÉLÉPHONE
    // =================================================

    const phoneButton =
        document.getElementById(
            "phoneButton"
        );


    if (data.phone) {

        phoneButton.href =
            "tel:" +
            data.phone;

    } else {

        phoneButton.href =
            "#";

        phoneButton.onclick =
            function(event) {

                event.preventDefault();

            };

    }



    // =================================================
    // EMAIL
    // =================================================

    const emailButton =
        document.getElementById(
            "emailButton"
        );


    if (data.email) {

        emailButton.href =
            "mailto:" +
            data.email;

    } else {

        emailButton.href =
            "#";

        emailButton.onclick =
            function(event) {

                event.preventDefault();

            };

    }



    // =================================================
    // INSTAGRAM
    // =================================================

    const instagramButton =
        document.getElementById(
            "instagramButton"
        );


    if (data.instagram_url) {

        instagramButton.href =
            data.instagram_url;

    } else {

        instagramButton.href =
            "#";

        instagramButton.onclick =
            function(event) {

                event.preventDefault();

            };

    }



    // =================================================
    // CV
    // =================================================

    const cvButton =
        document.getElementById(
            "cvButton"
        );


    if (data.cv_path) {

        const {
            data: publicData
        } = supabaseClient

            .storage

            .from(BUCKET)

            .getPublicUrl(
                data.cv_path
            );


        cvButton.href =
            publicData.publicUrl +
            "?v=" +
            Date.now();

    } else {

        cvButton.href =
            "#";

        cvButton.onclick =
            function(event) {

                event.preventDefault();

            };

    }



    // =================================================
    // PHOTO
    // =================================================

    const profileImage =
        document.getElementById(
            "profileImage"
        );


    if (data.profile_image_path) {

        const {
            data: publicData
        } = supabaseClient

            .storage

            .from(BUCKET)

            .getPublicUrl(
                data.profile_image_path
            );


        profileImage.src =
            publicData.publicUrl +
            "?v=" +
            Date.now();

    }



    // =================================================
    // AFFICHER
    // =================================================

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "content"
    ).style.display =
        "block";

}



// =====================================================
// LANCEMENT
// =====================================================

loadSite();

</script>


</body>

</html>
