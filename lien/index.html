<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Redirection...</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background: #f2f2f2;
            color: #777;
        }

        .message {
            text-align: center;
            padding: 30px;
        }

    </style>

</head>


<body>


<div class="message">

    Redirection...

</div>



<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
    "https://frdmtstprhyrcozuzkcf.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_YkzwqM3E18r1W0ztmJjXug_qJO2htuo";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



// =====================================================
// REDIRECTION AUTOMATIQUE
// =====================================================

async function redirectToLink() {


    const {
        data,
        error
    } =
        await supabaseClient

            .from("site-content")

            .select("link_url")

            .eq("id", 1)

            .single();



    // =================================================
    // ERREUR
    // =================================================

    if (error) {

        console.error(
            "Erreur Supabase :",
            error
        );

        document.querySelector(
            ".message"
        ).textContent =
            "Impossible de charger le lien.";

        return;

    }



    // =================================================
    // AUCUN LIEN
    // =================================================

    if (
        !data ||
        !data.link_url
    ) {

        document.querySelector(
            ".message"
        ).textContent =
            "Aucun lien configuré.";

        return;

    }



    // =================================================
    // PRÉPARER L'URL
    // =================================================

    let url =
        data.link_url.trim();



    if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ) {

        url =
            "https://" +
            url;

    }



    console.log(
        "Redirection automatique vers :",
        url
    );



    // =================================================
    // REDIRECTION IMMÉDIATE
    // =================================================

    window.location.replace(
        url
    );

}



// =====================================================
// LANCER LA REDIRECTION
// =====================================================

redirectToLink();

</script>


</body>

</html>
