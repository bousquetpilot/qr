<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code</title>

    <!--
        =====================================================
        CONFIGURATION DU QR CODE
        =====================================================

        Change uniquement la valeur de MODE.

        "site"  = ouvre ton site
        "image" = ouvre ton image
        "lien"  = ouvre ton lien
    -->

    <script>

        const MODE = "site";


        /*
            =================================================
            NE PAS MODIFIER EN DESSOUS
            =================================================
        */

        const destinations = {

            site: "site/",

            image: "image/",

            lien: "lien/"

        };


        if (destinations[MODE]) {

            window.location.replace(destinations[MODE]);

        } else {

            document.addEventListener("DOMContentLoaded", () => {

                document.body.innerHTML = `
                    <h1>Erreur</h1>
                    <p>La destination du QR code n'est pas configurée correctement.</p>
                `;

            });

        }

    </script>

</head>

<body>

    <p>Redirection...</p>

</body>

</html>
