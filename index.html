<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QR</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<p>Redirection...</p>


<script>

    const SUPABASE_URL =
        "https://frdmtstprhyrcozuzkcf.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_YkzwqM3E18r1W0ztmJjXug_qJO2htuo";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    async function redirectQR() {

        const { data, error } =

            await supabaseClient
                .from("qr-control")
                .select("destination")
                .eq("id", 1)
                .single();


        if (error) {

            document.body.innerHTML =
                "<h2>Erreur de connexion</h2>";

            console.error(error);

            return;

        }


        const destination =
            data.destination;


        const destinations = {

            site: "site/",

            image: "image/",

            lien: "lien/"

        };


        if (destinations[destination]) {

            window.location.replace(
                destinations[destination]
            );

        } else {

            document.body.innerHTML =
                "<h2>Destination inconnue</h2>";

        }

    }


    redirectQR();

</script>

</body>

</html>
