<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Link Library</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            padding: 25px 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .section {
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #eee;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #5b4bdb;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 11px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .add {
            background: #5b4bdb;
            color: white;
        }

        .back {
            background: #eee;
            color: #333;
        }

        .link-card {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 15px;
            margin-top: 12px;
        }

        .link-card.active {
            border: 2px solid #5b4bdb;
            background: #f8f7ff;
        }

        .link-name {
            font-weight: bold;
            font-size: 17px;
            margin-bottom: 7px;
        }

        .link-url {
            font-size: 13px;
            color: #777;
            word-break: break-all;
        }

        .active-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 5px 9px;
            border-radius: 20px;
            background: #5b4bdb;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .card-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .card-buttons button {
            margin-top: 0;
        }

        .use {
            background: #5b4bdb;
            color: white;
        }

        .delete {
            background: #eee;
            color: #c62828;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .success {
            color: #16833b;
        }

        .error {
            color: #c62828;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 20px 0;
        }

        .current-box {
            background: #f8f7ff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .current-label {
            font-size: 13px;
            color: #777;
            margin-bottom: 5px;
        }

        .current-name {
            font-weight: bold;
            font-size: 17px;
        }

        .current-url {
            font-size: 13px;
            color: #777;
            word-break: break-all;
            margin-top: 5px;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>🔗 Link Library</h1>

    <div class="subtitle">
        Gère les liens disponibles pour ton QR
    </div>



    <!-- =================================================
         LIEN ACTUEL
         ================================================= -->

    <div class="current-box">

        <div class="current-label">
            LIEN ACTUEL
        </div>

        <div
            id="currentName"
            class="current-name"
        >
            Chargement...
        </div>

        <div
            id="currentUrl"
            class="current-url"
        ></div>

    </div>



    <!-- =================================================
         AJOUTER UN LIEN
         ================================================= -->

    <div class="section">

        <div class="section-title">
            ➕ Ajouter un lien
        </div>


        <label for="linkName">
            Nom du lien
        </label>

        <input
            id="linkName"
            type="text"
            placeholder="YouTube"
        >


        <label for="linkUrl">
            URL
        </label>

        <input
            id="linkUrl"
            type="url"
            placeholder="https://www.youtube.com/"
        >


        <button
            class="add"
            onclick="addLink()"
        >
            ➕ AJOUTER LE LIEN
        </button>

    </div>



    <!-- =================================================
         BIBLIOTHÈQUE
         ================================================= -->

    <div class="section">

        <div class="section-title">
            📚 Mes liens
        </div>


        <div id="linksList">
            Chargement...
        </div>

    </div>



    <button
        class="back"
        onclick="location.href='../'"
    >
        ← RETOUR
    </button>


    <div id="message"></div>


</div>



<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
    "https://frdmtstprhyrcozuzkcf.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_YkzwqM3E18r1W0ztmJjXug_qJO2htuo";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// =====================================================
// VARIABLES
// =====================================================

let currentLink = "";

let currentLinkName = "";



// =====================================================
// VÉRIFICATION SESSION
// =====================================================

async function checkSession() {

    const {
        data: { session }
    } =
        await supabaseClient.auth.getSession();


    if (!session) {

        location.href = "../";

        return false;
    }


    return true;

}



// =====================================================
// CHARGER LE LIEN ACTUEL
// =====================================================

async function loadCurrentLink() {

    const {
        data,
        error
    } =
        await supabaseClient

            .from("site-content")

            .select(
                "link_name, link_url"
            )

            .eq("id", 1)

            .single();


    if (error) {

        console.error(
            "Erreur chargement lien actuel :",
            error
        );

        document.getElementById(
            "currentName"
        ).textContent =
            "Erreur de chargement";

        return;

    }


    currentLink =
        data.link_url || "";


    currentLinkName =
        data.link_name || "";



    // Afficher le lien actuel

    document.getElementById(
        "currentName"
    ).textContent =
        currentLinkName ||
        "Aucun lien sélectionné";


    document.getElementById(
        "currentUrl"
    ).textContent =
        currentLink;

}



// =====================================================
// CHARGER LA BIBLIOTHÈQUE
// =====================================================

async function loadLinks() {

    const {
        data,
        error
    } =
        await supabaseClient

            .from("link-library")

            .select(
                "id, name, url, created_at"
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Erreur bibliothèque :",
            error
        );


        document.getElementById(
            "linksList"
        ).innerHTML =
            '<div class="empty">Erreur de chargement.</div>';


        return;

    }


    renderLinks(
        data || []
    );

}



// =====================================================
// AFFICHER LES LIENS
// =====================================================

function renderLinks(links) {

    const container =
        document.getElementById(
            "linksList"
        );


    container.innerHTML = "";


    if (links.length === 0) {

        container.innerHTML =
            '<div class="empty">Aucun lien enregistré.</div>';

        return;

    }



    links.forEach(
        function(link) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "link-card";


            const isActive =
                link.url === currentLink;


            if (isActive) {

                card.classList.add(
                    "active"
                );

            }



            // NOM

            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "link-name";


            name.textContent =
                link.name;



            // URL

            const url =
                document.createElement(
                    "div"
                );


            url.className =
                "link-url";


            url.textContent =
                link.url;



            card.appendChild(
                name
            );


            card.appendChild(
                url
            );



            // BADGE ACTIF

            if (isActive) {

                const badge =
                    document.createElement(
                        "div"
                    );


                badge.className =
                    "active-badge";


                badge.textContent =
                    "LIEN ACTUEL";


                card.appendChild(
                    badge
                );

            }



            // BOUTONS

            const buttons =
                document.createElement(
                    "div"
                );


            buttons.className =
                "card-buttons";



            // UTILISER

            const useButton =
                document.createElement(
                    "button"
                );


            useButton.className =
                "use";


            useButton.textContent =
                "UTILISER CE LIEN";


            useButton.onclick =
                function() {

                    useLink(
                        link
                    );

                };


            buttons.appendChild(
                useButton
            );



            // SUPPRIMER

            if (!isActive) {

                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "delete";


                deleteButton.textContent =
                    "SUPPRIMER";


                deleteButton.onclick =
                    function() {

                        deleteLink(
                            link
                        );

                    };


                buttons.appendChild(
                    deleteButton
                );

            }



            card.appendChild(
                buttons
            );


            container.appendChild(
                card
            );

        }
    );

}



// =====================================================
// AJOUTER UN LIEN
// =====================================================

async function addLink() {

    let name =
        document.getElementById(
            "linkName"
        ).value.trim();


    let url =
        document.getElementById(
            "linkUrl"
        ).value.trim();



    if (!name) {

        showMessage(
            "Entre un nom pour le lien.",
            true
        );

        return;

    }



    if (!url) {

        showMessage(
            "Entre une URL.",
            true
        );

        return;

    }



    // Ajouter HTTPS automatiquement

    if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ) {

        url =
            "https://" +
            url;

    }



    const {
        data,
        error
    } =
        await supabaseClient

            .from("link-library")

            .insert({

                name: name,

                url: url

            })

            .select()
            .single();



    if (error) {

        console.error(
            "Erreur ajout lien :",
            error
        );

        showMessage(
            "Erreur : " +
            error.message,
            true
        );

        return;

    }



    console.log(
        "Lien ajouté :",
        data
    );



    document.getElementById(
        "linkName"
    ).value = "";


    document.getElementById(
        "linkUrl"
    ).value = "";



    await loadLinks();


    showMessage(
        "Lien ajouté ✓",
        false
    );

}



// =====================================================
// UTILISER UN LIEN
// =====================================================

async function useLink(link) {

    console.log(
        "================================="
    );

    console.log(
        "SÉLECTION DU LIEN"
    );

    console.log(
        "Nom :",
        link.name
    );

    console.log(
        "URL :",
        link.url
    );

    console.log(
        "================================="
    );



    showMessage(
        "Enregistrement...",
        false
    );



    // =================================================
    // ÉCRIRE DANS SITE-CONTENT
    // =================================================

    const {
        data,
        error
    } =
        await supabaseClient

            .from("site-content")

            .update({

                link_name:
                    link.name,

                link_url:
                    link.url

            })

            .eq(
                "id",
                1
            )

            .select(
                "id, link_name, link_url"
            );



    // =================================================
    // ERREUR
    // =================================================

    if (error) {

        console.error(
            "ERREUR UPDATE SITE-CONTENT :",
            error
        );


        showMessage(
            "Erreur : " +
            error.message,
            true
        );


        return;

    }



    // =================================================
    // AUCUNE LIGNE MODIFIÉE
    // =================================================

    if (
        !data ||
        data.length === 0
    ) {

        console.error(
            "Aucune ligne n'a été modifiée."
        );


        showMessage(
            "La modification n'a pas été enregistrée.",
            true
        );


        return;

    }



    // =================================================
    // VÉRIFICATION
    // =================================================

    const saved =
        data[0];


    console.log(
        "DONNÉES ENREGISTRÉES :",
        saved
    );



    // Vérifier que Supabase
    // contient bien le bon lien.

    if (
        saved.link_url !==
        link.url
    ) {

        console.error(
            "L'URL enregistrée ne correspond pas !",
            saved.link_url
        );


        showMessage(
            "Erreur : l'URL enregistrée est incorrecte.",
            true
        );


        return;

    }



    // =================================================
    // METTRE À JOUR L'ÉTAT LOCAL
    // =================================================

    currentLink =
        saved.link_url;


    currentLinkName =
        saved.link_name;



    // =================================================
    // AFFICHER LE NOUVEAU LIEN ACTUEL
    // =================================================

    document.getElementById(
        "currentName"
    ).textContent =
        currentLinkName;


    document.getElementById(
        "currentUrl"
    ).textContent =
        currentLink;



    // =================================================
    // RECHARGER LA BIBLIOTHÈQUE
    // =================================================

    await loadLinks();



    showMessage(
        "Lien enregistré ✓",
        false
    );

}



// =====================================================
// SUPPRIMER UN LIEN
// =====================================================

async function deleteLink(link) {


    // Sécurité supplémentaire

    if (
        link.url ===
        currentLink
    ) {

        alert(
            "Impossible de supprimer le lien actuellement utilisé."
        );

        return;

    }



    const confirmed =
        confirm(
            "Supprimer le lien « " +
            link.name +
            " » ?"
        );


    if (!confirmed) {

        return;

    }



    const {
        error
    } =
        await supabaseClient

            .from("link-library")

            .delete()

            .eq(
                "id",
                link.id
            );



    if (error) {

        console.error(
            "Erreur suppression :",
            error
        );


        showMessage(
            "Erreur : " +
            error.message,
            true
        );


        return;

    }



    await loadLinks();


    showMessage(
        "Lien supprimé ✓",
        false
    );

}



// =====================================================
// MESSAGE
// =====================================================

function showMessage(
    text,
    isError
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        isError
            ? "error"
            : "success";


    setTimeout(
        function() {

            message.textContent = "";

        },
        5000
    );

}



// =====================================================
// INITIALISATION
// =====================================================

async function init() {

    const loggedIn =
        await checkSession();


    if (!loggedIn) {

        return;

    }


    await loadCurrentLink();


    await loadLinks();

}


init();

</script>


</body>

</html>
