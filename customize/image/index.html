<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Library</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f2;font-family:Arial;padding:20px}.wrap{max-width:760px;margin:auto}
.card{background:white;padding:24px;border-radius:22px;box-shadow:0 10px 30px #0001}h1{text-align:center;margin:0 0 8px}
.sub{text-align:center;color:#666;margin-bottom:20px}.actions{display:flex;gap:10px;margin-bottom:18px}
button,label{border:0;border-radius:12px;padding:14px 16px;font-size:15px;cursor:pointer}.add{background:#5b4bdb;color:white;flex:1;text-align:center}.back{background:#777;color:white}
#file{display:none}#status{text-align:center;color:#555;min-height:22px;margin:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}.item{position:relative;border:2px solid #ddd;border-radius:16px;padding:8px;background:#fafafa;cursor:pointer}.item.active{border-color:#5b4bdb}
.thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#eee;display:block}.name{font-size:12px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;left:14px;top:14px;background:#5b4bdb;color:white;border-radius:7px;padding:4px 6px;font-size:10px}
.del{position:absolute;right:12px;top:12px;width:32px;height:32px;padding:0;border-radius:50%;background:#111;color:white;font-size:19px}
.preview{margin-top:24px;border-top:1px solid #eee;padding-top:20px;text-align:center}.preview img{max-width:100%;max-height:360px;border-radius:14px}
</style></head><body><div class="wrap"><div class="card">
<h1>Image Library</h1><div class="sub">Choisis l'image affichée en mode IMAGE.</div>
<div class="actions"><label class="add">＋ AJOUTER UNE IMAGE<input id="file" type="file" accept="image/*"></label><button class="back" onclick="location.href='../'">← RETOUR</button></div>
<div id="status"></div><div id="grid" class="grid"></div>
<div id="preview" class="preview" style="display:none"><h3>Prévisualisation</h3><img id="prev"></div>
</div></div>
<script>
const sb=window.supabase.createClient("https://frdmtstprhyrcozuzkcf.supabase.co","sb_publishable_YkzwqM3E18r1W0ztmJjXug_qJO2htuo"), bucket="qr-images";
let current=null, pending=null;
const status=document.getElementById("status"), grid=document.getElementById("grid"), file=document.getElementById("file");
const pub=p=>sb.storage.from(bucket).getPublicUrl(p).data.publicUrl;
async function auth(){const {data}=await sb.auth.getSession();if(!data.session){location.href="../../control/";return false}return true}
async function currentImage(){const {data,error}=await sb.from("qr-control").select("image_path").eq("id",1).single();if(error)throw error;current=data.image_path}
async function load(){status.textContent="Chargement...";const {data,error}=await sb.storage.from(bucket).list("",{limit:100,offset:0,sortBy:{column:"created_at",order:"desc"}});if(error){status.textContent="Erreur : "+error.message;return}grid.innerHTML="";const list=(data||[]).filter(x=>x.name);
if(!list.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:35px;color:#777">Aucune image.</div>';status.textContent="";return}
list.forEach(x=>{const p=x.name, d=document.createElement("div");d.className="item"+(p===current?" active":"");d.onclick=()=>select(p);
const im=document.createElement("img");im.className="thumb";im.src=pub(p);im.alt=p;d.appendChild(im);
const n=document.createElement("div");n.className="name";n.textContent=p;d.appendChild(n);
if(p===current){const b=document.createElement("div");b.className="badge";b.textContent="ACTIVE";d.appendChild(b)}
const b=document.createElement("button");b.className="del";b.textContent="×";b.onclick=e=>{e.stopPropagation();remove(p)};d.appendChild(b);grid.appendChild(d)});status.textContent=""}
async function select(p){const {error}=await sb.from("qr-control").update({image_path:p}).eq("id",1);if(error){status.textContent="Erreur : "+error.message;return}current=p;document.getElementById("prev").src=pub(p);document.getElementById("preview").style.display="block";await load();status.textContent="Image active ✓"}
file.onchange=async()=>{const f=file.files[0];if(!f)return;status.textContent="Importation...";const ext=(f.name.split(".").pop()||"jpg").toLowerCase();const base=(f.name.replace(/\.[^/.]+$/,"").replace(/[^a-zA-Z0-9_-]+/g,"-").slice(0,50)||"image");const name=Date.now()+"-"+base+"."+ext;const {error}=await sb.storage.from(bucket).upload(name,f,{upsert:false,contentType:f.type});file.value="";if(error){status.textContent="Erreur : "+error.message;return}await load();await select(name)}
async function remove(p){if(p===current){alert("Cette image est actuellement utilisée. Sélectionne d'abord une autre image.");return}if(!confirm("Supprimer cette image ?"))return;status.textContent="Suppression...";const {error}=await sb.storage.from(bucket).remove([p]);if(error)status.textContent="Erreur : "+error.message;else{await load();status.textContent="Image supprimée ✓"}}
(async()=>{if(await auth()){try{await currentImage();await load();if(current){document.getElementById("prev").src=pub(current);document.getElementById("preview").style.display="block"}}catch(e){status.textContent="Erreur : "+e.message}}})();
</script></body></html>
