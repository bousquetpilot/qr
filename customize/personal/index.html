<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal Info</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            padding: 25px 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .section {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #eee;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #5b4bdb;
        }

        .photo-box {
            text-align: center;
        }

        #photoPreview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            display: none;
            margin: 0 auto 15px;
            border: 3px solid #eee;
        }

        .file-input {
            padding: 10px;
            background: #f5f5f5;
        }

        .file-name {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-top: 8px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 11px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 22px;
        }

        .save {
            background: #5b4bdb;
            color: white;
        }

        .back {
            background: #eee;
            color: #333;
            margin-top: 10px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .success {
            color: #16833b;
        }

        .error {
            color: #c62828;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>👤 Personal Info</h1>

    <div class="subtitle">
        Informations affichées sur ton site
    </div>



    <!-- =========================
         IDENTITÉ
         ========================= -->

    <div class="section">

        <div class="section-title">
            👤 Identité
        </div>


        <label for="name">
            Nom
        </label>

        <input
            id="name"
            type="text"
            placeholder="Romain Bousquet"
        >


        <label for="title">
            Titre / profession
        </label>

        <input
            id="title"
            type="text"
            placeholder="Pilot ✈️"
        >


        <label for="description">
            Description
        </label>

        <textarea
            id="description"
            placeholder="Description..."
        ></textarea>

    </div>



    <!-- =========================
         PHOTO
         ========================= -->

    <div class="section">

        <div class="section-title">
            📸 Photo de profil
        </div>

        <div class="photo-box">

            <img
                id="photoPreview"
                alt="Photo de profil"
            >

            <input
                id="photo"
                class="file-input"
                type="file"
                accept="image/*"
            >

            <div
                id="photoName"
                class="file-name"
            ></div>

        </div>

    </div>



    <!-- =========================
         CONTACT
         ========================= -->

    <div class="section">

        <div class="section-title">
            📞 Contact
        </div>


        <label for="phone">
            Téléphone
        </label>

        <input
            id="phone"
            type="tel"
            placeholder="+33..."
        >


        <label for="email">
            Email
        </label>

        <input
            id="email"
            type="email"
            placeholder="ton@email.com"
        >


        <label for="address">
            Adresse
        </label>

        <input
            id="address"
            type="text"
            placeholder="Adresse"
        >

    </div>



    <!-- =========================
         RÉSEAUX
         ========================= -->

    <div class="section">

        <div class="section-title">
            📱 Réseaux sociaux
        </div>


        <label for="instagram">
            Instagram
        </label>

        <input
            id="instagram"
            type="url"
            placeholder="https://www.instagram.com/..."
        >

    </div>



    <!-- =========================
         CV
         ========================= -->

    <div class="section">

        <div class="section-title">
            📄 CV
        </div>


        <input
            id="cv"
            class="file-input"
            type="file"
            accept=".pdf,application/pdf"
        >


        <div
            id="cvName"
            class="file-name"
        ></div>

    </div>



    <!-- =========================
         BOUTONS
         ========================= -->

    <button
        class="save"
        onclick="saveInfo()"
    >
        💾 ENREGISTRER
    </button>


    <button
        class="back"
        onclick="location.href='../'"
    >
        ← RETOUR
    </button>


    <div id="message"></div>


</div>



<script>


const SUPABASE_URL =
    "https://frdmtstprhyrcozuzkcf.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_YkzwqM3E18r1W0ztmJjXug_qJO2htuo";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const BUCKET = "qr-images";


let currentPhotoPath = null;

let currentCvPath = null;



// =====================================================
// VÉRIFICATION CONNEXION
// =====================================================

async function checkSession() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        location.href = "../";

        return false;
    }


    return true;
}



// =====================================================
// CHARGER LES DONNÉES
// =====================================================

async function loadInfo() {

    const {
        data,
        error
    } = await supabaseClient

        .from("site-content")

        .select(`
            name,
            title,
            phone,
            email,
            address,
            description,
            instagram_url,
            cv_path,
            profile_image_path
        `)

        .eq("id", 1)

        .single();


    if (error) {

        showMessage(
            "Erreur : " + error.message,
            true
        );

        return;
    }


    document.getElementById("name").value =
        data.name || "";


    document.getElementById("title").value =
        data.title || "";


    document.getElementById("phone").value =
        data.phone || "";


    document.getElementById("email").value =
        data.email || "";


    document.getElementById("address").value =
        data.address || "";


    document.getElementById("description").value =
        data.description || "";


    document.getElementById("instagram").value =
        data.instagram_url || "";


    currentPhotoPath =
        data.profile_image_path || null;


    currentCvPath =
        data.cv_path || null;



    // PHOTO EXISTANTE

    if (currentPhotoPath) {

        showPhoto(currentPhotoPath);
    }


    // CV EXISTANT

    if (currentCvPath) {

        document.getElementById("cvName")
            .textContent =
                "CV actuel enregistré ✓";
    }

}



// =====================================================
// AFFICHER PHOTO
// =====================================================

function showPhoto(path) {

    const {
        data
    } = supabaseClient

        .storage

        .from(BUCKET)

        .getPublicUrl(path);


    const image =
        document.getElementById(
            "photoPreview"
        );


    image.src =
        data.publicUrl +
        "?v=" +
        Date.now();


    image.style.display =
        "block";
}



// =====================================================
// APERÇU NOUVELLE PHOTO
// =====================================================

document
    .getElementById("photo")
    .addEventListener(
        "change",
        function() {

            const file =
                this.files[0];


            if (!file) {
                return;
            }


            document.getElementById(
                "photoName"
            ).textContent =
                file.name;


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    const image =
                        document.getElementById(
                            "photoPreview"
                        );


                    image.src =
                        event.target.result;


                    image.style.display =
                        "block";
                };


            reader.readAsDataURL(file);

        }
    );



// =====================================================
// NOUVEAU CV
// =====================================================

document
    .getElementById("cv")
    .addEventListener(
        "change",
        function() {

            const file =
                this.files[0];


            if (!file) {
                return;
            }


            document.getElementById(
                "cvName"
            ).textContent =
                file.name;

        }
    );



// =====================================================
// ENREGISTRER
// =====================================================

async function saveInfo() {

    showMessage(
        "Enregistrement...",
        false
    );


    const name =
        document.getElementById("name").value;


    const title =
        document.getElementById("title").value;


    const phone =
        document.getElementById("phone").value;


    const email =
        document.getElementById("email").value;


    const address =
        document.getElementById("address").value;


    const description =
        document.getElementById("description").value;


    const instagram =
        document.getElementById("instagram").value;



    // =================================================
    // PHOTO
    // =================================================

    const photoFile =
        document.getElementById(
            "photo"
        ).files[0];


    let newPhotoPath =
        currentPhotoPath;


    if (photoFile) {

        const extension =
            photoFile.name
                .split(".")
                .pop()
                .toLowerCase();


        const path =
            "profile/" +
            Date.now() +
            "-profile." +
            extension;


        const {
            error
        } = await supabaseClient

            .storage

            .from(BUCKET)

            .upload(
                path,
                photoFile,
                {
                    upsert: false,
                    contentType: photoFile.type,
                    cacheControl: "3600"
                }
            );


        if (error) {

            showMessage(
                "Erreur photo : " +
                error.message,
                true
            );

            return;
        }


        newPhotoPath = path;
    }



    // =================================================
    // CV
    // =================================================

    const cvFile =
        document.getElementById(
            "cv"
        ).files[0];


    let newCvPath =
        currentCvPath;


    if (cvFile) {

        if (
            cvFile.type !==
            "application/pdf"
        ) {

            showMessage(
                "Le CV doit être un PDF.",
                true
            );

            return;
        }


        const path =
            "cv/" +
            Date.now() +
            "-cv.pdf";


        const {
            error
        } = await supabaseClient

            .storage

            .from(BUCKET)

            .upload(
                path,
                cvFile,
                {
                    upsert: false,
                    contentType:
                        "application/pdf",
                    cacheControl: "3600"
                }
            );


        if (error) {

            showMessage(
                "Erreur CV : " +
                error.message,
                true
            );

            return;
        }


        newCvPath = path;
    }



    // =================================================
    // ENREGISTREMENT SUPABASE
    // =================================================

    const {
        error
    } = await supabaseClient

        .from("site-content")

        .update({

            name: name,

            title: title,

            phone: phone,

            email: email,

            address: address,

            description: description,

            instagram_url: instagram,

            cv_path: newCvPath,

            profile_image_path:
                newPhotoPath

        })

        .eq("id", 1);



    if (error) {

        showMessage(
            "Erreur : " + error.message,
            true
        );

        return;
    }



    // =================================================
    // SUPPRIMER ANCIENNE PHOTO
    // =================================================

    if (
        photoFile &&
        currentPhotoPath &&
        currentPhotoPath !== newPhotoPath
    ) {

        await supabaseClient

            .storage

            .from(BUCKET)

            .remove([
                currentPhotoPath
            ]);
    }



    // =================================================
    // SUPPRIMER ANCIEN CV
    // =================================================

    if (
        cvFile &&
        currentCvPath &&
        currentCvPath !== newCvPath
    ) {

        await supabaseClient

            .storage

            .from(BUCKET)

            .remove([
                currentCvPath
            ]);
    }



    currentPhotoPath =
        newPhotoPath;


    currentCvPath =
        newCvPath;



    showMessage(
        "Informations enregistrées ✓",
        false
    );

}



// =====================================================
// MESSAGE
// =====================================================

function showMessage(
    text,
    error
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        error
            ? "error"
            : "success";


    if (!error) {

        setTimeout(
            () => {
                message.textContent = "";
            },
            5000
        );
    }

}



// =====================================================
// INITIALISATION
// =====================================================

async function init() {

    const loggedIn =
        await checkSession();


    if (!loggedIn) {
        return;
    }


    await loadInfo();
}


init();

</script>

</body>

</html>
