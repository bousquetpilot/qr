<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Info</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #5b4bdb;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
        }

        .save {
            background: #5b4bdb;
            color: white;
        }

        .save:hover {
            background: #4939c5;
        }

        .back {
            background: #eee;
            color: #333;
            margin-top: 10px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .success {
            color: #16833b;
        }

        .error {
            color: #c62828;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>👤 Personal Info</h1>

    <div class="subtitle">
        Informations affichées sur ta page personnelle
    </div>

    <label for="name">Nom</label>
    <input
        type="text"
        id="name"
        placeholder="Ton nom"
    >

    <label for="phone">Téléphone</label>
    <input
        type="tel"
        id="phone"
        placeholder="+33 ..."
    >

    <label for="email">Email</label>
    <input
        type="email"
        id="email"
        placeholder="ton@email.com"
    >

    <label for="address">Adresse</label>
    <input
        type="text"
        id="address"
        placeholder="Ton adresse"
    >

    <label for="description">Description</label>
    <textarea
        id="description"
        placeholder="Quelques informations à propos de toi..."
    ></textarea>

    <button class="save" onclick="saveInfo()">
        💾 ENREGISTRER
    </button>

    <button class="back" onclick="location.href='../'">
        ← RETOUR
    </button>

    <div id="message"></div>

</div>

<script>

const SUPABASE_URL =
    "https://frdmtstprhyrcozuzkcf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_YkzwqM3E18r1W0ztmJjXug_qJO2htuo";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function checkSession() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
        window.location.href = "../";
        return false;
    }

    return true;
}


async function loadInfo() {

    const {
        data,
        error
    } = await supabaseClient
        .from("site-content")
        .select(
            "name, phone, email, address, description"
        )
        .eq("id", 1)
        .single();

    if (error) {

        document.getElementById("message").textContent =
            "Erreur : " + error.message;

        document.getElementById("message").className =
            "error";

        return;
    }

    document.getElementById("name").value =
        data.name || "";

    document.getElementById("phone").value =
        data.phone || "";

    document.getElementById("email").value =
        data.email || "";

    document.getElementById("address").value =
        data.address || "";

    document.getElementById("description").value =
        data.description || "";
}


async function saveInfo() {

    const message =
        document.getElementById("message");

    message.textContent = "Enregistrement...";
    message.className = "";


    const name =
        document.getElementById("name").value;

    const phone =
        document.getElementById("phone").value;

    const email =
        document.getElementById("email").value;

    const address =
        document.getElementById("address").value;

    const description =
        document.getElementById("description").value;


    const {
        error
    } = await supabaseClient
        .from("site-content")
        .update({
            name: name,
            phone: phone,
            email: email,
            address: address,
            description: description
        })
        .eq("id", 1);


    if (error) {

        message.textContent =
            "Erreur : " + error.message;

        message.className =
            "error";

        return;
    }


    message.textContent =
        "Informations enregistrées ✓";

    message.className =
        "success";


    setTimeout(() => {

        message.textContent = "";

    }, 5000);
}


async function init() {

    const loggedIn =
        await checkSession();

    if (!loggedIn) {
        return;
    }

    await loadInfo();
}


init();

</script>

</body>
</html>
