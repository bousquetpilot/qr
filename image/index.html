<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: white;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #image {
            display: block;
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        #message {
            font-family: Arial, sans-serif;
            color: #555;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <img id="image" alt="" style="display:none;">
    <div id="message">Chargement...</div>

<script>
    const SUPABASE_URL =
        "https://frdmtstprhyrcozuzkcf.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_YkzwqM3E18r1W0ztmJjXug_qJO2htuo";

    const BUCKET = "qr-images";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    async function loadImage() {

        const message =
            document.getElementById("message");

        const image =
            document.getElementById("image");

        // Récupérer l'image actuellement sélectionnée
        const { data, error } =
            await supabaseClient
                .from("qr-control")
                .select("image_path")
                .eq("id", 1)
                .single();

        if (error) {
            message.textContent =
                "Erreur : " + error.message;
            return;
        }

        if (!data.image_path) {
            message.textContent =
                "Aucune image sélectionnée.";
            return;
        }

        // Construire l'URL publique de l'image
        const { data: publicData } =
            supabaseClient
                .storage
                .from(BUCKET)
                .getPublicUrl(data.image_path);

        // Petit paramètre anti-cache :
        // il évite que le navigateur garde l'ancienne image.
        image.src =
            publicData.publicUrl +
            "?v=" +
            Date.now();

        image.onload = () => {
            message.style.display = "none";
            image.style.display = "block";
        };

        image.onerror = () => {
            message.textContent =
                "Impossible de charger cette image.";
            image.style.display = "none";
        };
    }

    loadImage();
</script>

</body>
</html>
